name: "✅ VERIFICAR SE O PROJETO ESTÁ ORGANIZADO"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: "✅ Conferir governança, main única e organização"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Ler o projeto deste commit"
        uses: actions/checkout@v4

      - name: "🐍 Preparar verificador"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: "✅ Conferir arquivos e regras obrigatórias"
        run: python scripts/check_governance.py

      - name: "🌿 Conferir linha técnica autorizada"
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "Branch verificada: ${BRANCH}"
          if [ "${BRANCH}" != "main" ]; then
            echo "FAIL: somente a main está autorizada durante descoberta."
            echo "Branch adicional exige autorização clara e explícita do proprietário registrada no Notion."
            exit 1
          fi
          echo "PASS: Somente a main está autorizada durante descoberta."

      - name: "🌿 Conferir se refs antigas não dispersam conhecimento"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          echo "main: ${MAIN_SHA}"
          BAD=0
          while IFS=$'\t' read -r NAME SHA; do
            [ -z "${NAME}" ] && continue
            if [ "${NAME}" = "main" ]; then
              continue
            fi
            echo "Ref histórica: ${NAME} @ ${SHA}"
            if [ "${SHA}" != "${MAIN_SHA}" ]; then
              echo "FAIL: ${NAME} diverge da main e pode dispersar conhecimento."
              BAD=1
            fi
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[] | [.name, .commit.sha] | @tsv')
          if [ "${BAD}" -ne 0 ]; then
            exit 1
          fi
          echo "PASS: refs remotas não contêm estado divergente da main."
