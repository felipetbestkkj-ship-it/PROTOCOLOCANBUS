name: "✅ VERIFICAR SE O PROJETO ESTÁ ORGANIZADO"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: "✅ Conferir governança, branches e organização"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Ler o projeto deste commit"
        uses: actions/checkout@v4

      - name: "🐍 Preparar verificador"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: "✅ Conferir arquivos e regras obrigatórias"
        run: python scripts/check_governance.py

      - name: "🌿 Conferir formato da linha técnica"
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "Branch verificada: ${BRANCH}"
          case "${BRANCH}" in
            main)
              echo "PASS: main é a linha padrão."
              ;;
            work/*|lab/*)
              echo "PASS DE FORMATO: branch temporária usa nomenclatura aceita."
              echo "IMPORTANTE: este workflow não consegue provar a autorização do proprietário no Notion."
              echo "Criar/usar esta branch só é válido quando a autorização explícita existir para o objetivo."
              ;;
            *)
              echo "FAIL: branch fora da política. Use main ou, somente após autorização explícita, work/* ou lab/*."
              exit 1
              ;;
          esac

      - name: "🌿 Mostrar quantidade de branches remotas"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          COUNT="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | wc -l)"
          echo "Branches remotas ativas: ${COUNT}"
          echo "Regra: sem autorização, somente main. O padrão autorizado normal é main + uma branch temporária."
          if [ "${COUNT}" -gt 2 ]; then
            echo "ATENÇÃO: há mais de uma branch temporária. Cada branch adicional precisa de justificativa e autorização explícita próprias."
          fi
