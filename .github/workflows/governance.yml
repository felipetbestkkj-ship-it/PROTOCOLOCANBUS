name: "✅ VERIFICAR SE O PROJETO ESTÁ ORGANIZADO"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: "✅ Conferir governança, branches e organização"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Ler o projeto deste commit"
        uses: actions/checkout@v4

      - name: "🐍 Preparar verificador"
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: "✅ Conferir arquivos e regras obrigatórias"
        run: python scripts/check_governance.py

      - name: "🌿 Conferir nome da branch"
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          echo "Branch verificada: ${BRANCH}"
          case "${BRANCH}" in
            main|work/*|lab/*)
              echo "PASS: nome de branch permitido."
              ;;
            *)
              echo "FAIL: branch '${BRANCH}' não segue a política."
              echo "Use main, work/f<fase>-<objetivo> ou lab/f<fase>-<pergunta>."
              exit 1
              ;;
          esac

      - name: "🌿 Conferir se existem branches demais"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          COUNT="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | wc -l | tr -d ' ')"
          echo "Branches remotas ativas: ${COUNT}"
          if [ "${COUNT}" -gt 3 ]; then
            echo "FAIL: o projeto permite no máximo 3 branches remotas ativas por padrão."
            echo "Consolide ou remova uma branch temporária antes de criar outra."
            exit 1
          fi
          echo "PASS: quantidade de branches dentro do limite."
